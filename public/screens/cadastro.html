<!doctype html>
<!-- O idioma permite ao navegador e aos leitores de tela interpretar este conteúdo em português. -->
<html lang="pt-BR">
  <head>
    <!-- UTF-8 preserva os acentos nos textos e comentários. -->
    <meta charset="utf-8" />
    <!-- A largura acompanha a tela para que o layout móvel possa aplicar seus próprios recuos. -->
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- O título identifica a página na aba do navegador. -->
    <title>PI2 • Cadastro do paciente</title>
    <!-- Reutiliza o estilo compartilhado, sem duplicar regras nesta página. -->
    <link rel="stylesheet" href="../assets/css/tema.css" />
    <script src="../assets/js/api.js" defer></script>
    <!-- Carrega o comportamento depois da leitura da estrutura HTML por meio de defer. -->
    <script src="../assets/js/cadastro.js" defer></script>
  </head>
  <body>
    <!-- Mantém a identificação do projeto e a navegação principal no mesmo lugar. -->
    <header>
      <div class="marca">
        PI2
        <small>Sistema de atendimento</small>
      </div>
      <a href="../index.html">Índice do projeto</a>
    </header>
    <main>
      <h1>Cadastro do paciente</h1>
      <p class="subtitulo">
        Etapa 1 de 3 (Recepção). Preencha os dados do paciente e salve para seguir para a triagem.
      </p>

      <section class="cartao">
        <form id="form-cadastro" novalidate>
          <p class="meta">Campos com * são obrigatórios.</p>

          <div class="formulario">
            <label class="campo inteira">
              Nome completo *
              <input
                type="text"
                id="nome"
                name="nome"
                autocomplete="off"
                required
                aria-describedby="erro-nome"
              />
              <span class="erro" id="erro-nome"></span>
            </label>

            <label class="campo">
              Data de nascimento *
              <input
                type="date"
                id="dataNascimento"
                name="dataNascimento"
                required
                aria-describedby="erro-dataNascimento"
              />
              <span class="erro" id="erro-dataNascimento"></span>
            </label>

            <label class="campo">
              CPF *
              <small>Somente números ou com pontos e traço</small>
              <input
                type="text"
                id="cpf"
                name="cpf"
                inputmode="numeric"
                required
                maxlength="14"
                placeholder="000.000.000-00"
                aria-describedby="erro-cpf"
              />
              <span class="erro" id="erro-cpf"></span>
            </label>

            <label class="campo">
              Sexo
              <select id="sexo" name="sexo">
                <option value="">Não informado</option>
                <option value="F">Feminino</option>
                <option value="M">Masculino</option>
              </select>
            </label>

            <label class="campo">
              Telefone
              <input type="tel" id="telefone" name="telefone" />
            </label>

            <label class="campo inteira">
              Contato de emergência
              <small>Nome e telefone de alguém que possa ser avisado</small>
              <input type="text" id="contatoEmergencia" name="contatoEmergencia" />
            </label>

            <label class="campo inteira">
              Queixa principal *
              <small>O motivo da vinda ao pronto atendimento, em poucas palavras</small>
              <textarea
                id="queixa"
                name="queixa"
                required
                aria-describedby="erro-queixa"
              ></textarea>
              <span class="erro" id="erro-queixa"></span>
            </label>
          </div>

          <div class="acoes">
            <button type="submit">Salvar cadastro</button>
            <button type="reset" class="secundario">Limpar</button>
            <a class="botao" id="link-triagem" href="triagem.html" hidden>Ir para a triagem</a>
          </div>

          <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <footer>Projeto integrador • Dados fictícios</footer>
  </body>
</html>
